# Optional: not a required check.
name: tests (optional)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pq
        uses: peachq-org/setup-peachq@v1.0.0
        with:
          version: 0.92.20261116
      - name: Run the tie-out and unit suite
        shell: bash
        run: |
          $QCMD tests/run_all.q -classic | tee out.txt
          echo "**peachq ${{ steps.pq.outputs.version }}:** $(grep -E 'RESULTS:' out.txt | tail -1)" >> "$GITHUB_STEP_SUMMARY"
